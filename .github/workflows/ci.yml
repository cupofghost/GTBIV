name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node syntax-check.js
      # The CODE MAP is generated. Two branches editing index.html will both
      # rewrite it, and a merge can land numbers that match neither side —
      # silently, since it is only a comment. Fail here instead.
      - run: node ../tools/codemap.js
      - run: npm test
