name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite grows with every feature batch. At the OP2 merge (a1d21e2) the
    # job ran 14m03s of this budget — `npm test` alone was 13m26s — so the next
    # few test files would have failed CI on the clock rather than on a defect.
    timeout-minutes: 25

    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node syntax-check.js
      - run: npm test
